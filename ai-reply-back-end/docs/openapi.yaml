openapi: 3.0.3
info:
  title: AI Reply Backend API
  version: "1.0.0"
  description: >
    Мобильный API AI Reply. Тексты сообщений не сохраняются: сервер обрабатывает
    их только в памяти во время запроса.
externalDocs:
  description: Публичная оферта
  url: https://ai-reply.kz/offer
servers:
  - url: https://ai-reply.kz
    description: production
paths:
  /healthz:
    get:
      summary: Живость сервиса
      responses: { "200": { description: "{ ok: true } — без имени окружения" } }
  /api/v1/config:
    get:
      summary: Публичная конфигурация клиента (языки, лимиты, способы входа)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
  /api/v1/plans:
    get:
      summary: Видимые тарифы; у каждого purchasable (можно купить прямо сейчас)
      responses: { "200": { description: OK } }
  /api/v1/auth/email/otp/request:
    post:
      summary: Отправить 4-значный код на почту (Resend)
      description: >
        Ответ одинаков для известного и нового адреса. Новый код аннулирует
        предыдущий; повторный запрос раньше OTP_RESEND_COOLDOWN отклоняется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, example: "aigerim@mail.kz" }
                locale: { type: string, enum: [kk, ru, en, uz] }
      responses:
        "200":
          description: Код отправлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChallenge" }
        "400": { description: INVALID_EMAIL }
        "429":
          description: >-
            OTP_RESEND_COOLDOWN (details.retry_after_seconds, Retry-After) / RATE_LIMITED — лимиты на адрес
            (RATE_OTP_REQUEST_PER_ADDRESS_PER_HOUR, RATE_OTP_REQUEST_PER_DAY, OTP_MAX_FAILED_PER_DAY неверных
            кодов за 24 ч; с retry_after_seconds) и мягкий лимит на IP (RATE_OTP_REQUEST_PER_HOUR)
        "503": { description: EMAIL_DELIVERY_FAILED }
  /api/v1/auth/email/otp/verify:
    post:
      summary: Проверить код и получить сессию (аккаунт создаётся при первом входе)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{4}$", example: "0384" }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { description: "access_token, refresh_token, user (auth_providers), profile, subscription, usage" }
        "400": { description: "INVALID_OTP (details.attempts_remaining) / OTP_EXPIRED / OTP_ALREADY_USED / INVALID_EMAIL" }
        "429": { description: "OTP_ATTEMPTS_EXCEEDED / RATE_LIMITED (OTP_MAX_FAILED_PER_DAY неверных кодов на адрес за 24 ч — details.retry_after_seconds; IP — RATE_OTP_VERIFY_PER_HOUR)" }
  /api/v1/auth/google:
    post:
      summary: Вход через Google (ID token проверяется сервером по JWKS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token, nonce]
              properties:
                id_token: { type: string }
                nonce: { type: string, description: "Тот же nonce, что передан в Google SDK / Credential Manager" }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { description: Сессия }
        "401": { description: INVALID_ID_TOKEN — не истёкшая сессия, refresh не нужен }
        "409": { description: EMAIL_ALREADY_IN_USE }
        "503": { description: AUTH_PROVIDER_UNAVAILABLE }
  /api/v1/auth/apple:
    post:
      summary: Вход через Apple (identity token проверяется сервером по JWKS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identity_token, nonce]
              properties:
                identity_token: { type: string }
                nonce: { type: string, description: "Сырой nonce; Apple получил его SHA-256 (hex)" }
                full_name: { type: string, maxLength: 120 }
                device: { $ref: "#/components/schemas/Device" }
      responses:
        "200": { description: Сессия }
        "401": { description: INVALID_ID_TOKEN }
        "409": { description: EMAIL_ALREADY_IN_USE }
        "503": { description: AUTH_PROVIDER_UNAVAILABLE }
  /api/v1/auth/request-otp:
    post:
      summary: "Устаревший вход по identifier (старые сборки)"
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier]
              properties:
                identifier: { type: string, example: "+7 701 123 45 67" }
                locale: { type: string, enum: [kk, ru, en, uz] }
      responses:
        "200": { description: Запрос принят, код отправлен доступным каналом }
        "400": { description: INVALID_REQUEST — номер не поддерживается }
        "429": { description: RATE_LIMITED }
  /api/v1/auth/verify-otp:
    post:
      summary: "Устаревшая проверка кода по identifier (старые сборки)"
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, code]
              properties:
                identifier: { type: string }
                code: { type: string, example: "4827" }
                device:
                  type: object
                  properties:
                    device_id: { type: string }
                    platform: { type: string, enum: [ios, android, web] }
                    app_version: { type: string }
                    os_version: { type: string }
                    locale: { type: string }
                    timezone: { type: string }
      responses:
        "200": { description: access_token, refresh_token, user, usage }
        "400": { description: INVALID_OTP / OTP_EXPIRED }
  /api/v1/auth/refresh:
    post:
      summary: Обновить пару токенов (с ротацией)
      responses:
        "200": { description: OK }
        "401": { description: UNAUTHORIZED }
  /api/v1/auth/logout:
    post:
      summary: Закрыть сессию (вся цепочка refresh-токена, в т.ч. уже ротированного)
      parameters:
        - name: X-Installation-ID
          in: header
          required: false
          description: >-
            Установка, с которой выходят: она сразу отвязывается от аккаунта (даже если
            refresh-токен уже истёк). Единственный запрос, где клиент шлёт этот заголовок.
          schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
      responses: { "200": { description: OK } }
  /api/v1/me:
    get:
      summary: Профиль, тариф и квота (user.preferred_language — kk | ru | en | uz | "")
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }
    delete:
      summary: Удалить аккаунт и все его данные на сервере (сразу, без отмены)
      description: >-
        Тело необязательно. С apple_authorization_code сервер отзывает токен Sign in with Apple,
        если у аккаунта есть вход через Apple и заданы APPLE_TEAM_ID / APPLE_KEY_ID / APPLE_PRIVATE_KEY;
        ошибка Apple удалению не мешает. После ответа все токены аккаунта отвечают 401.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200":
          description: Удалено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "400": { description: INVALID_REQUEST — неизвестное поле }
        "401": { description: UNAUTHORIZED }
    patch:
      summary: Частичное обновление профиля (POST /api/v1/me — то же для Android)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdate" }
      responses:
        "200":
          description: Обновлённый профиль
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { description: "INVALID_REQUEST — неизвестное поле, неверный grammatical_gender, onboarding_version вне 0…1000 или неизвестный preferred_language (details.field)" }
  /api/v1/me/delete:
    post:
      summary: То же, что DELETE /api/v1/me (для клиентов, которые не шлют тело с DELETE)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "200":
          description: Удалено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteAccountResult" }
        "401": { description: UNAUTHORIZED }
  /api/v1/account/delete/request:
    post:
      summary: Страница /account/delete — код удаления на почту аккаунта
      description: >-
        Ответ всегда {"ok": true}: существует ли аккаунт, не раскрывается. Код (purpose=delete)
        уходит только на почту существующего аккаунта, с лимитами и паузой обычного e-mail OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                locale: { type: string, enum: [kk, ru, en, uz] }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { description: INVALID_EMAIL }
        "429": { description: RATE_LIMITED }
  /api/v1/account/delete/confirm:
    post:
      summary: Страница /account/delete — код верен, аккаунт удаляется
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              additionalProperties: false
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "200": { description: "{ deleted: true }" }
        "400": { description: "INVALID_OTP (details.attempts_remaining) / OTP_EXPIRED / OTP_ALREADY_USED" }
        "429": { description: OTP_ATTEMPTS_EXCEEDED / RATE_LIMITED }
  /api/v1/me/email/otp/request:
    post:
      summary: Код на почту, которую нужно добавить к аккаунту для входа
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale: { type: string, enum: [kk, ru, en, uz] }
      responses:
        "200":
          description: Код отправлен
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailChallenge" }
        "409": { description: CONFLICT — у аккаунта уже есть почта / EMAIL_ALREADY_IN_USE }
        "429": { description: OTP_RESEND_COOLDOWN / RATE_LIMITED }
  /api/v1/me/email/otp/verify:
    post:
      summary: Подтвердить код — почта привязана к аккаунту
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{4}$" }
      responses:
        "200": { description: То же, что GET /api/v1/me }
        "400": { description: INVALID_OTP / OTP_EXPIRED / OTP_ALREADY_USED }
        "409": { description: EMAIL_ALREADY_IN_USE }
  /api/v1/me/usage:
    get:
      summary: Остаток генераций (тариф, бесплатные ответы, кредиты, пропуск)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usage" }
  /api/v1/me/credits:
    get:
      summary: Баланс сверх тарифа и последние 50 записей журнала (features.credits)
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Credits" }
  /api/v1/me/subscription:
    get:
      summary: Текущая подписка
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }
  /api/v1/me/consents:
    post:
      summary: Сохранить принятие текущей оферты и политики конфиденциальности
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LegalConsentRequest" }
      responses:
        "200":
          description: Согласие сохранено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LegalConsent" }
        "400": { description: INVALID_REQUEST — версия не текущая (клиент должен обновить конфигурацию) }
    delete:
      summary: Отозвать согласие на AI-обработку
      description: >-
        Идемпотентно. Запись остаётся с withdrawn_at; /ai/reply, /ai/compose и /ai/polish отвечают
        403 CONSENT_REQUIRED, пока приложение снова не отправит POST. Аккаунт сохраняется.
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: "{ ok: true }" }
        "401": { description: UNAUTHORIZED }
  /api/v1/devices:
    post:
      summary: Регистрация устройства (старые сборки; push — через /api/v1/installations)
      deprecated: true
      security: [{ bearerAuth: [] }]
      responses: { "200": { description: OK } }
  /api/v1/installations:
    post:
      summary: Регистрация установки приложения (анонимной или с аккаунтом) и FCM-токена
      description: >-
        features.installations. Аккаунт берётся только из Bearer-токена: с токеном установка
        привязывается к аккаунту, без него становится анонимной; недействительный токен → 401,
        ничего не меняется. Токен хранится зашифрованным и в ответах не возвращается. Лимит —
        RATE_GENERIC_PER_MINUTE на установку и ×20 на IP.
      security: [{ bearerAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstallationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Installation" }
        "400": { description: "INVALID_REQUEST (details.field: installation_id, platform, push.provider, push.token, …) или неизвестное поле" }
        "401": { description: недействительный access-токен }
        "429": { description: RATE_LIMITED }
  /api/v1/installations/{installation_id}/detach:
    post:
      summary: Отвязать установку от аккаунта (с токеном — только свою)
      security: [{ bearerAuth: [] }, {}]
      parameters:
        - { name: installation_id, in: path, required: true, schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  detached: { type: boolean }
        "400": { description: "INVALID_REQUEST (details.field = installation_id)" }
  /api/v1/me/notification-preferences:
    get:
      summary: Категории уведомлений пользователя
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
    put:
      summary: Включить или выключить категории (push и письма, кроме письма subscription_activated; security выключить нельзя)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preferences]
              additionalProperties: false
              properties:
                preferences:
                  type: object
                  minProperties: 1
                  additionalProperties: { type: boolean }
                  example: { marketing: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { description: "INVALID_REQUEST — пустой объект, неизвестная категория или security: false (details.field)" }
  /api/v1/notifications/opened:
    post:
      summary: Пользователь открыл push (по did из data)
      description: >-
        Отмечается, только если доставка ушла на эту установку. Вызов best-effort, без повторов.
        Лимит — общий с /installations бюджет установки (по installation_id) и ×20 на IP.
      security: [{ bearerAuth: [] }, {}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id, delivery_id]
              additionalProperties: false
              properties:
                installation_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
                delivery_id: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  recorded: { type: boolean }
        "400": { description: INVALID_REQUEST (details.field) }
  /api/v1/devices/{id}:
    delete:
      summary: Отозвать устройство
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: OK } }
  /api/v1/ai/reply:
    post:
      summary: Сгенерировать ответ
      description: >-
        Язык ответа решает входящее сообщение (source_text), а не язык интерфейса,
        раскладка или язык instruction: profile.reply_language → уверенно определённый
        язык сообщения → input_language → language. Другой язык даёт только явная
        просьба в instruction («ответь на русском»).
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_text]
              properties:
                source_text: { type: string, maxLength: 400, description: "max_source_characters из /config" }
                instruction: { type: string, maxLength: 400 }
                language: { type: string, enum: [kk, ru, en, uz], description: "язык интерфейса; язык ответа решает, только если язык сообщения не ясен" }
                input_language: { type: string, enum: [kk, ru, en], description: "раскладка при нажатии Reply (features.sender_profile); решает, только если язык сообщения не ясен; неизвестное значение игнорируется" }
                template_id: { type: string }
                template: { type: object }
                business_context: { type: object }
                profile:
                  type: object
                  properties:
                    description: { type: string }
                    role: { type: string }
                    preferred_tone: { type: string, enum: [natural, friendly, professional, formal, short] }
                    business: { type: object }
                    reply_language: { type: string, enum: [auto, kk, ru, en, uz], description: "features.reply_preferences" }
                    grammatical_gender: { type: string, enum: [male, female, unspecified], description: "features.sender_profile; иначе — сохранённое значение" }
                platform: { type: string }
                app_version: { type: string }
      responses:
        "200":
          description: reply + usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  reply: { type: string }
                  detected_language: { type: string }
                  usage: { $ref: "#/components/schemas/Usage" }
        "400": { description: "INVALID_REQUEST (details.field = source_text | idempotency_key) или неизвестное поле" }
        "403": { description: CONSENT_REQUIRED — нет согласия на текущие версии условий и политики }
        "409": { description: "CONFLICT, details.field = idempotency_key: reason = in_progress (тот же ключ ещё выполняется) | used (ключ уже оплатил ответ и бесплатный повтор израсходован или прошло 10 минут)" }
        "429": { description: "DAILY_LIMIT_REACHED / MONTHLY_LIMIT_REACHED — закончились все источники (details: daily_limit, used_today, resets_at; monthly_limit и used_month при месячном лимите; welcome_remaining, credits_remaining, pass_active, can_buy) / RATE_LIMITED" }
        "502": { description: AI_PROVIDER_UNAVAILABLE }
        "504": { description: AI_TIMEOUT }
  /api/v1/ai/compose:
    post:
      summary: Написать новое сообщение по инструкции (режим «Создать»)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties:
                instruction: { type: string, maxLength: 400, description: "max_instruction_length из /config" }
                language: { type: string, enum: [kk, ru, en, uz], description: "язык интерфейса" }
                input_language: { type: string, enum: [kk, ru, en], description: "features.sender_profile" }
                profile:
                  type: object
                  description: "features.sender_profile; других полей нет"
                  properties:
                    grammatical_gender: { type: string, enum: [male, female, unspecified] }
                regenerate: { type: boolean, description: "другая версия по той же инструкции" }
                platform: { type: string }
                app_version: { type: string }
      responses:
        "200":
          description: text + usage
          content:
            application/json:
              schema:
                type: object
                properties:
                  text: { type: string }
                  detected_language: { type: string }
                  usage: { $ref: "#/components/schemas/Usage" }
        "400": { description: "INVALID_REQUEST (details.field = instruction | idempotency_key)" }
        "401": { description: UNAUTHORIZED }
        "403": { description: CONSENT_REQUIRED }
        "409": { description: "CONFLICT, details.field = idempotency_key, reason = in_progress | used (как у /ai/reply)" }
        "429": { description: "DAILY_LIMIT_REACHED / MONTHLY_LIMIT_REACHED (details как у /ai/reply) / RATE_LIMITED" }
        "502": { description: AI_PROVIDER_UNAVAILABLE }
        "504": { description: AI_TIMEOUT }
  /api/v1/ai/polish:
    post:
      summary: Подсказка — исправленный текст инструкции (квота не тратится)
      description: >-
        Работает, когда features.instruction_polish = true; иначе 404 NOT_FOUND. Потолок —
        LIMIT_POLISH_PER_DAY (100) на пользователя за сутки сервера; сверх него ответ
        200 { text: исходный, changed: false } без обращения к провайдеру.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, maxLength: 400, description: "max_instruction_length из /config" }
                input_language: { type: string, enum: [kk, ru, en] }
                platform: { type: string }
                app_version: { type: string }
      responses:
        "200":
          description: "changed = false — подсказки нет, text равен исходному"
          content:
            application/json:
              schema:
                type: object
                required: [text, changed]
                properties:
                  text: { type: string }
                  changed: { type: boolean }
        "400": { description: "INVALID_REQUEST (details.field = text, details.max_characters)" }
        "401": { description: UNAUTHORIZED }
        "403": { description: "CONSENT_REQUIRED — нет согласия на текущие версии условий и политики (клиенты молча игнорируют ошибки polish)" }
        "404": { description: NOT_FOUND — polish выключен (AI_POLISH_ENABLED=false) }
        "429": { description: RATE_LIMITED — отдельный лимит RATE_POLISH_PER_MINUTE }
        "502": { description: AI_PROVIDER_UNAVAILABLE }
        "504": { description: AI_TIMEOUT }
  /api/v1/ai/transcribe:
    post:
      summary: Голосовой ввод клавиатуры — запись → текст (квота ответов не тратится)
      description: >-
        Работает, когда features.voice_transcription = true; иначе 404 NOT_FOUND. Формат записи
        определяется по байтам (MP4/M4A или WAV), длительность — из контейнера (0,2…41 с).
        Тот же request_id того же пользователя не вызывает OpenAI повторно: идущий запрос
        ожидается, успешный результат возвращается 10 минут, ошибки не запоминаются.
        Запись и текст не сохраняются и не логируются. Потолок — LIMIT_TRANSCRIBE_PER_DAY (100)
        на пользователя за сутки сервера.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, duration_ms, request_id]
              properties:
                audio: { type: string, format: binary, description: "M4A/MP4 или WAV (PCM), не больше 4 MiB; Content-Type части не читается" }
                duration_ms: { type: integer, minimum: 300, maximum: 40500, description: "длительность активного звука по часам клиента" }
                request_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$", description: "ключ идемпотентности, новый на каждую запись" }
                languages: { type: string, example: "kk,ru", description: "подсказки через запятую, самый вероятный первым: kk, ru, en, uz; неизвестные отбрасываются, максимум 3" }
                purpose: { type: string, enum: [dictation, instruction], default: dictation }
      responses:
        "200":
          description: "text может быть пустым; duration_ms — из контейнера"
          content:
            application/json:
              schema:
                type: object
                required: [text, languages, duration_ms]
                properties:
                  text: { type: string }
                  languages: { type: array, items: { type: string }, example: [kk] }
                  duration_ms: { type: integer, example: 3021 }
        "400": { description: "INVALID_REQUEST (details.field = request_id | duration_ms | purpose | languages; для записи details { field: audio, reason: required | too_large | format | unreadable | too_short | too_long, max_seconds: 40, max_bytes: 4194304 })" }
        "401": { description: UNAUTHORIZED }
        "403": { description: CONSENT_REQUIRED }
        "404": { description: NOT_FOUND — голосовой ввод выключен (TRANSCRIBE_ENABLED=false) }
        "429": { description: "RATE_LIMITED — лимит RATE_TRANSCRIBE_PER_MINUTE или OpenAI; VOICE_LIMIT_REACHED — LIMIT_TRANSCRIBE_PER_DAY, details { daily_limit, resets_at }" }
        "502": { description: AI_PROVIDER_UNAVAILABLE }
        "504": { description: AI_TIMEOUT }
  /api/v1/ai/reports:
    post:
      summary: Пожаловаться на сгенерированный текст (features.ai_reports)
      description: >-
        text — только если пользователь оставил «Отправить текст ответа вместе с жалобой».
        Согласие на AI-обработку не требуется. Лимит RATE_AI_REPORTS_PER_HOUR на пользователя.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AIReportRequest" }
      responses:
        "201":
          description: Принято
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
        "400": { description: "INVALID_REQUEST (details.field: mode, reason, comment, text, platform) или неизвестное поле" }
        "401": { description: UNAUTHORIZED }
        "429": { description: RATE_LIMITED }
  /api/v1/analytics/events:
    post:
      summary: События онбординга и настроек (только из приложений, только счётчики)
      description: >-
        Работает, когда features.product_events = true; иначе 404 NOT_FOUND. Каждое
        событие проверяется отдельно по закрытому списку (имя, ключи props, типы и
        значения); неподходящее отклоняется, остальные сохраняются. Свободный текст
        не сохраняется. Список событий и props — docs/API.md.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, events]
              properties:
                platform: { type: string, enum: [ios, android] }
                app_version: { type: string, pattern: '^[0-9]{1,4}(\.[0-9]{1,4}){0,3}( \([0-9]{1,6}\))?$', example: "2.0.1" }
                events:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items: { $ref: "#/components/schemas/ProductEvent" }
      responses:
        "200":
          description: Сколько событий сохранено и сколько отклонено
          content:
            application/json:
              schema:
                type: object
                required: [accepted, rejected]
                properties:
                  accepted: { type: integer }
                  rejected: { type: integer }
        "400": { description: "INVALID_REQUEST (details.field = platform | app_version | events; для events — details.max_events)" }
        "401": { description: UNAUTHORIZED }
        "404": { description: NOT_FOUND — приём выключен (PRODUCT_EVENTS_ENABLED=false) }
        "429": { description: RATE_LIMITED — отдельный лимит RATE_EVENTS_PER_MINUTE }
  /api/v1/iap/products:
    get:
      summary: Пакеты ответов и пропуск для этой платформы (features.iap_ios / features.iap_android)
      description: >-
        Только товары, которые администратор настроил (units и Product ID этого магазина),
        включил и не отправил в архив. Цены — в StoreKit / Play Billing. account_token —
        постоянный UUID аккаунта: iOS передаёт его в appAccountToken, Android — в
        setObfuscatedAccountId. Без platform — платформа из токена.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: platform, in: query, required: false, schema: { type: string, enum: [ios, android] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [products, account_token]
                properties:
                  products: { type: array, items: { $ref: "#/components/schemas/IAPProduct" } }
                  account_token: { type: string, format: uuid }
        "400": { description: "INVALID_REQUEST, details.field = platform" }
        "401": { description: UNAUTHORIZED }
        "403": { description: "IAP_UNAVAILABLE — продажи на этой платформе закрыты" }
  /api/v1/iap/apple/transactions:
    post:
      summary: StoreKit 2 transaction.jwsRepresentation → начисление (transaction.finish() только после 200)
      description: >-
        Проверка: ES256, x5c до встроенного Apple Root CA - G3 с маркерами Apple, цепочка
        действительна на signedDate; bundleId, environment (Sandbox — только при
        APPLE_IAP_ACCEPT_SANDBOX=true), type Consumable | Non-Renewing Subscription,
        appAccountToken = account_token, нет revocationDate, productId — товар из админки.
        Одна транзакция начисляется один раз. Лимит RATE_IAP_PER_MINUTE на аккаунт.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [signed_transaction]
              properties:
                signed_transaction: { type: string, description: "VerificationResult<Transaction>.jwsRepresentation" }
      responses:
        "200":
          description: Начислено сейчас (granted) или раньше (already_granted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResult" }
        "400": { description: "PURCHASE_INVALID, details.reason = malformed | signature | bundle_mismatch | environment | product_type | account_mismatch | revoked | product_unknown | quantity; INVALID_REQUEST (details.field = signed_transaction) или неизвестное поле" }
        "401": { description: UNAUTHORIZED }
        "403": { description: "IAP_UNAVAILABLE — App Store не подключён на сервере" }
        "409": { description: PURCHASE_BELONGS_TO_ANOTHER_ACCOUNT }
        "429": { description: RATE_LIMITED }
  /api/v1/iap/google/purchases:
    post:
      summary: Play Billing purchase token → начисление, затем сервер сам потребляет покупку (клиент не вызывает consume)
      description: >-
        purchases.products.get: obfuscatedExternalAccountId = account_token, purchaseState 0
        (2 — 202 pending, ничего не начислено), не потреблена другим, product_id — товар из
        админки, productId в ответе Google (если есть) тот же. Сначала начисление, затем consume;
        неудачный consume повторяет фоновая задача. purchaseType 0 (лицензионный тестер) —
        только при GOOGLE_PLAY_ACCEPT_TEST=true (по умолчанию в production — нет), environment
        Test. Лимит RATE_IAP_PER_MINUTE.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [product_id, purchase_token]
              properties:
                product_id: { type: string, pattern: "^[a-z0-9][a-z0-9._]{0,99}$" }
                purchase_token: { type: string, maxLength: 1024 }
      responses:
        "200":
          description: Начислено сейчас (granted) или раньше (already_granted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResult" }
        "202":
          description: Оплата ещё не прошла
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, enum: [pending] } } }
        "400": { description: "PURCHASE_INVALID, details.reason = malformed | product_unknown | not_found | account_mismatch | environment | canceled | already_consumed | revoked | unsupported_type; INVALID_REQUEST (details.field = product_id | purchase_token)" }
        "401": { description: UNAUTHORIZED }
        "403": { description: "IAP_UNAVAILABLE — Google Play не подключён на сервере" }
        "409": { description: PURCHASE_BELONGS_TO_ANOTHER_ACCOUNT }
        "429": { description: RATE_LIMITED }
        "503": { description: "STORE_UNAVAILABLE — Google API не ответил; повторить позже" }
  /api/v1/iap/apple/notifications:
    post:
      summary: App Store Server Notifications V2 (URL для App Store Connect, Production и Sandbox)
      description: >-
        Публичный; подпись signedPayload проверяется той же цепочкой Apple. После проверки —
        всегда 200, каждое notificationUUID обрабатывается один раз. REFUND / REVOKE снимают
        остаток покупки (баланс не уходит в минус), REFUND_REVERSED возвращает снятое (или
        снимает запись раннего возврата неотправленной транзакции), TEST, CONSUMPTION_REQUEST,
        REFUND_DECLINED — только в журнал.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signedPayload]
              properties:
                signedPayload: { type: string }
      responses:
        "200": { description: "{ ok: true }" }
        "400": { description: "PURCHASE_INVALID (подпись не проверена) или INVALID_REQUEST" }
        "403": { description: "IAP_UNAVAILABLE — App Store не подключён" }
        "500": { description: "ошибка записи — Apple повторит" }
  /api/v1/admin/notifications:
    get:
      tags: [admin]
      summary: Состояние push и справочники формы кампании
      security: [{ adminSession: [] }]
      responses: { "200": { description: "status { enabled, worker, fcm, email, link_hosts }, categories (категории кампаний: subscription, system, marketing), screens, content_locales, required_locales, fallback_locale, languages, segments, subscription, quota, platforms, channels, types, limits" } }
  /api/v1/admin/notifications/audience/preview:
    post:
      tags: [admin]
      summary: Сколько получателей у фильтра (ничего не отправляет; 30 в минуту на админа)
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audience: { $ref: "#/components/schemas/AudienceFilter" }
                category: { type: string, enum: [subscription, system, marketing], default: marketing, description: "security и account — только события сервера (400)" }
      responses:
        "200": { description: "preview { users, devices, matched_devices, android, ios, by_language { kk|ru|en|uz: { users, devices } }, unresolved [emails] }, audience (нормализованный)" }
        "400": { description: "INVALID_REQUEST (details.field = audience.segment, audience.plan_ids, …)" }
        "429": { description: RATE_LIMITED (details.retry_after_seconds) }
  /api/v1/admin/notifications/campaigns:
    get:
      tags: [admin]
      summary: Кампании (status, page, limit)
      security: [{ adminSession: [] }]
      responses: { "200": { description: "{ campaigns: [Campaign], total, page, limit }" } }
    post:
      tags: [admin]
      summary: Создать кампанию (send = true — сразу отправить)
      security: [{ adminSession: [] }]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Повтор с тем же ключом возвращает ту же кампанию (лимит отправок не тратит, если она уже
            отправлена); тот же ключ с другим содержимым — 409.
          schema: { type: string, pattern: "^[A-Za-z0-9_:.-]{8,128}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CampaignRequest" }
      responses:
        "201": { description: "Campaign + created: true" }
        "200": { description: "повтор: Campaign + created: false" }
        "400": { description: "INVALID_REQUEST (details.field = title.kk, body.ru, fallback_locale, link, data.<key>, category, audience.*, idempotency_key)" }
        "409": { description: "CONFLICT (details.field = idempotency_key) / PUSH_DISABLED" }
        "429": { description: "RATE_LIMITED — больше RATE_PUSH_CAMPAIGNS_PER_HOUR отправок в час" }
  /api/v1/admin/notifications/campaigns/{id}:
    get:
      tags: [admin]
      summary: Кампания, статистика (в т.ч. by_language) и errors [{ code, count }]
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: OK }, "404": { description: NOT_FOUND } }
  /api/v1/admin/notifications/campaigns/{id}/send:
    post:
      tags: [admin]
      summary: Отправить черновик (повтор безопасен)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Campaign }, "409": { description: "отменена / PUSH_DISABLED" }, "429": { description: RATE_LIMITED } }
  /api/v1/admin/notifications/campaigns/{id}/cancel:
    post:
      tags: [admin]
      summary: Отменить (неотправленные доставки отменяются, отправка «в полёте» не повторяется; завершённую — 409)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: Campaign }, "409": { description: CONFLICT } }
  /api/v1/admin/notifications/deliveries:
    get:
      tags: [admin]
      summary: Журнал доставок push и писем
      security: [{ adminSession: [] }]
      parameters:
        - { name: campaign_id, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [queued, sending, retrying, provider_accepted, provider_failed, invalid_token, skipped, cancelled] } }
        - { name: platform, in: query, schema: { type: string, enum: [android, ios] } }
        - { name: channel, in: query, schema: { type: string, enum: [push, email] } }
        - { name: type, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string, enum: [campaign, automatic] } }
        - { name: locale, in: query, schema: { type: string, enum: [kk, ru, en, uz] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
      responses: { "200": { description: "{ deliveries: [{ id, notification_id, campaign_id, campaign_name, title, type, category, channel, locale, user_id, installation_id, platform, provider, device, app_version, push, status, attempts, error_code, error_detail, created_at, sent_at, failed_at, opened_at }], total, page, limit }; push — отпечаток токена, на который ушла попытка" } }
  /api/v1/admin/notifications/devices:
    get:
      tags: [admin]
      summary: Реестр установок (токен — только отпечаток, installation_id — первые 8 символов)
      security: [{ adminSession: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: platform, in: query, schema: { type: string, enum: [android, ios] } }
        - { name: push_status, in: query, schema: { type: string, enum: [none, active, invalid, replaced] } }
        - { name: auth, in: query, schema: { type: string, enum: [authenticated, anonymous] } }
        - { name: app_version, in: query, schema: { type: string } }
      responses: { "200": { description: "{ devices: [...], total, page, limit }" } }
  /api/v1/admin/reports:
    get:
      tags: [admin]
      summary: Жалобы на AI-ответы, новые первыми (identifier — маска почты; text показывается)
      security: [{ adminSession: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] }, description: "без параметра — все" }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
      responses: { "200": { description: "{ reports: [...], total, page, limit }" }, "400": { description: "INVALID_REQUEST (details.field = status)" } }
  /api/v1/admin/reports/{id}/resolve:
    post:
      tags: [admin]
      summary: Отметить жалобу решённой (аудит report.resolve)
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{ ok: true, changed: bool }" }, "404": { description: NOT_FOUND } }
  /api/v1/admin/settings/welcome-bonus:
    post:
      tags: [admin]
      summary: Бесплатные ответы новых аккаунтов (0 — выключено); аудит settings.welcome_bonus.update { before, after, since_before, since_after }
      description: Действует только на аккаунты, созданные после изменения; выданные ответы не меняются. Включение из 0 в той же записи переносит welcome_bonus_since (since) на момент включения, так что аккаунты, созданные при выключенном бонусе, его не получают.
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [units]
              properties:
                units: { type: integer, minimum: 0, maximum: 1000 }
      responses:
        "200": { description: "{ units, default: 50, since: \"2026-10-20 15:04\", range: { min, max } }" }
        "400": { description: "INVALID_REQUEST, details.field = units, reason = range" }
  /api/v1/admin/users/{id}/credits:
    post:
      tags: [admin]
      summary: Начислить ответы вручную (kind admin, без срока); аудит credits.grant { grant_id, kind, units, reason }
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [units, reason]
              properties:
                units: { type: integer, minimum: 1, maximum: 10000 }
                reason: { type: string, maxLength: 200, description: "обязательна; приводится к одной строке" }
      responses:
        "200": { description: "{ grant: { id, kind, units_total, units_remaining, status, created_at, expires_at, reason, by, revoked_at, revoke_reason } }" }
        "400": { description: "INVALID_REQUEST, details.field = units (range) | reason (required, too_long)" }
        "404": { description: NOT_FOUND }
        "429": { description: "RATE_LIMITED — больше 60 начислений в час на администратора" }
  /api/v1/admin/users/{id}/credits/{grant_id}/revoke:
    post:
      tags: [admin]
      summary: Отозвать остаток начисления (любого вида); аудит credits.revoke { grant_id, kind, units_revoked, reason }
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: grant_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 200 }
      responses:
        "200": { description: "{ grant, units_revoked }" }
        "404": { description: NOT_FOUND }
        "409": { description: "CONFLICT, details.field = grant_id, reason = revoked" }
  /api/v1/admin/iap/products:
    get:
      tags: [admin]
      summary: Товары (архивные в конце) и состояние магазинов
      security: [{ adminSession: [] }]
      responses:
        "200": { description: "{ products: [{ id, code, kind, units, duration_hours, apple_product_id, google_product_id, name, is_active, sort_order, archived, archived_at, sales, offered_ios, offered_android, created_at, updated_at }], iap: { enabled, configured, apple, google, apple_sandbox, google_test, bundle_id, package_name, voided_polling, available_ios, available_android, notification_url, ranges } }" }
    post:
      tags: [admin]
      summary: Создать товар; аудит iap_product.create
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IAPProductInput" }
      responses:
        "201": { description: "{ product }" }
        "400": { description: "INVALID_REQUEST, details.field = code | kind | units | duration_hours | apple_product_id | google_product_id | is_active | sort_order | name.<язык>" }
        "409": { description: "CONFLICT, details.field = code | apple_product_id | google_product_id, reason = taken" }
  /api/v1/admin/iap/products/{id}:
    patch:
      tags: [admin]
      summary: Изменить товар (code и kind не меняются; новые units и часы — только для новых покупок); аудит iap_product.update { before, after }
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IAPProductInput" }
      responses:
        "200": { description: "{ product }" }
        "400": { description: "INVALID_REQUEST (как при создании; code, kind — reason = immutable)" }
        "404": { description: NOT_FOUND }
        "409": { description: "CONFLICT — товар в архиве (details.field = product) или Product ID занят" }
  /api/v1/admin/iap/products/{id}/archive:
    post:
      tags: [admin]
      summary: В архив (не продаётся, Product ID остаётся занятым); аудит iap_product.archive
      security: [{ adminSession: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses: { "200": { description: "{ ok: true }" }, "404": { description: NOT_FOUND }, "409": { description: "CONFLICT — уже в архиве" } }
  /api/v1/admin/iap/purchases:
    get:
      tags: [admin]
      summary: Покупки, новые первыми, и сводка по магазинам, средам и статусам
      security: [{ adminSession: [] }]
      parameters:
        - { name: provider, in: query, schema: { type: string, enum: [app_store, google_play] } }
        - { name: status, in: query, schema: { type: string, enum: [pending, granted, refunded, revoked, rejected] } }
        - { name: environment, in: query, schema: { type: string, enum: [Production, Sandbox, Test, Promo] } }
        - { name: user_id, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
      responses:
        "200": { description: "{ purchases: [{ id, user_id, identifier, provider, environment, product_code, store_product_id, transaction_id, order_id, quantity, units, status, consumed, purchased_at, created_at, revoked_at, revoke_reason }], total, page, limit, stats: [{ provider, environment, status, count, units }] }" }
        "400": { description: "INVALID_REQUEST, details.field = provider | status | environment" }
  /api/v1/admin/settings/iap:
    post:
      tags: [admin]
      summary: Продажи в приложении вкл/выкл; аудит settings.iap.update { before, after }
      security: [{ adminSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200": { description: "состояние iap, как в GET /iap/products" }
        "409": { description: "IAP_UNAVAILABLE, details.reason = store_not_configured — ни один магазин не подключён" }
  /v1/auth/register:
    post:
      summary: "Совместимость: install_id → токен (старые сборки; только при LEGACY_API_ENABLED=true, по умолчанию выключено)"
      deprecated: true
      responses: { "200": { description: OK } }
  /v1/reply/generate:
    post:
      summary: "Совместимость: прежний формат генерации"
      deprecated: true
      responses: { "200": { description: OK } }
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$" }
      description: >-
        features.idempotent_generation. Один ключ на действие пользователя (Reply, Create,
        Regenerate), повторяется только при автоматическом повторе того же действия. Ключ
        оплачивает не больше одного ответа: повтор после успеха в течение 10 минут генерирует
        ещё раз бесплатно (usage.bucket — источник первой оплаты), следующий — 409
        reason = used; пока первый запрос выполняется — 409 reason = in_progress; после
        неудачи (возврат) ключ можно использовать снова. Текст ответа не хранится. Без
        заголовка каждый запрос оплачивается, как раньше.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminSession:
      type: apiKey
      in: cookie
      name: aireply_admin
      description: Cookie-сессия админ-панели (ADMIN_COOKIE_NAME); для POST нужен ещё заголовок X-CSRF-Token.
  schemas:
    LegalConfig:
      type: object
      required: [terms_version, privacy_version, terms_url, privacy_url, support_url, account_deletion_url, ai_provider]
      properties:
        terms_version: { type: string, example: "2026-10-08" }
        privacy_version: { type: string, example: "2026-10-08" }
        terms_url: { type: string, format: uri, example: "https://ai-reply.kz/offer" }
        privacy_url: { type: string, format: uri, example: "https://ai-reply.kz/privacy" }
        contact_email: { type: string, description: "CONTACT_EMAIL; пустая строка, если не задан" }
        support_url: { type: string, format: uri, example: "https://ai-reply.kz/support" }
        account_deletion_url: { type: string, format: uri, example: "https://ai-reply.kz/account/delete" }
        ai_provider: { type: string, example: "OpenAI" }
    PublicConfig:
      type: object
      properties:
        locales:
          type: array
          items: { type: string, enum: [kk, ru, en, uz] }
        timezone: { type: string, example: "Asia/Almaty" }
        max_source_characters: { type: integer, example: 300 }
        max_instruction_length: { type: integer, example: 400 }
        features:
          type: object
          properties:
            email_otp: { type: boolean, description: "Resend настроен (или демо-режим)" }
            google_sign_in: { type: boolean }
            apple_sign_in: { type: boolean }
            compose: { type: boolean, description: "POST /api/v1/ai/compose доступен" }
            reply_preferences: { type: boolean, description: "profile.reply_language в /ai/reply" }
            sender_profile: { type: boolean, description: "grammatical_gender и input_language в /ai/*, grammatical_gender и onboarding_version в /me" }
            instruction_polish: { type: boolean, description: "POST /api/v1/ai/polish доступен" }
            voice_transcription: { type: boolean, description: "POST /api/v1/ai/transcribe доступен (ключ OpenAI задан и TRANSCRIBE_ENABLED не false)" }
            product_events: { type: boolean, description: "POST /api/v1/analytics/events доступен" }
            installations: { type: boolean, description: "POST /api/v1/installations и /notifications/opened доступны" }
            push_notifications: { type: boolean, description: "push включён и FCM настроен (Android и iOS)" }
            preferred_language: { type: boolean, description: "preferred_language в PATCH|POST /me и в user" }
            purchases: { type: boolean, description: "тариф можно купить прямо сейчас (переключатель админки + интеграция оплаты)" }
            ai_reports: { type: boolean, description: "POST /api/v1/ai/reports доступен — показывать «Пожаловаться»" }
            account_deletion: { type: boolean, description: "DELETE /api/v1/me и POST /api/v1/me/delete доступны" }
            welcome_bonus: { type: boolean, description: "новые аккаунты получают бесплатные ответы (welcome_bonus_units > 0)" }
            credits: { type: boolean, description: "usage.welcome/credits/pass/remaining_total/bucket, GET /me/credits, расширенные details лимитных ошибок" }
            idempotent_generation: { type: boolean, description: "заголовок Idempotency-Key на /ai/reply и /ai/compose" }
            iap_ios: { type: boolean, description: "можно купить пакет или пропуск в App Store: магазин подключён, продажи включены, есть активный товар с Apple Product ID" }
            iap_android: { type: boolean, description: "то же для Google Play" }
        demo_mode: { type: boolean }
        payment_mode: { type: string, enum: [off, demo, live], description: "по умолчанию off" }
        legal: { $ref: "#/components/schemas/LegalConfig" }
    ProductEvent:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          enum: [onboarding_started, onboarding_step_viewed, onboarding_keyboard_step_viewed,
                 keyboard_enabled_detected, full_access_enabled_detected, paste_tutorial_viewed,
                 onboarding_practice_completed, onboarding_completed, onboarding_reopened,
                 gender_selected, autocorrect_enabled, autocorrect_disabled]
        ts: { type: string, format: date-time, description: "время на устройстве, RFC 3339" }
        props:
          type: object
          description: "Только ключи, разрешённые для этого события: целые 0…1000, bool или код из закрытого списка"
          additionalProperties:
            oneOf: [{ type: integer, minimum: 0, maximum: 1000 }, { type: boolean }, { type: string }]
    Profile:
      type: object
      properties:
        display_name: { type: string }
        role: { type: string }
        description: { type: string }
        preferred_tone: { type: string }
        business_offering: { type: string }
        business_summary: { type: string }
        business_rules: { type: array, items: { type: string } }
        onboarding_completed: { type: boolean }
        grammatical_gender: { type: string, enum: [male, female, unspecified] }
        onboarding_version: { type: integer, minimum: 0, maximum: 1000 }
        updated_at: { type: string, format: date-time }
    ProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        display_name: { type: string }
        role: { type: string }
        description: { type: string }
        preferred_tone: { type: string, enum: [natural, friendly, professional, formal, short] }
        business_offering: { type: string }
        business_summary: { type: string }
        business_rules: { type: array, items: { type: string }, maxItems: 8 }
        locale: { type: string, enum: [kk, ru, en, uz] }
        timezone: { type: string }
        onboarding_completed: { type: boolean }
        grammatical_gender: { type: string, enum: [male, female, unspecified], description: "features.sender_profile" }
        onboarding_version: { type: integer, minimum: 0, maximum: 1000, description: "features.sender_profile; хранится максимум" }
        preferred_language: { type: string, enum: [kk, ru, en, uz], description: "features.preferred_language; ru-KZ → ru, иное → 400. Язык push и писем" }
    Device:
      type: object
      properties:
        device_id: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        app_version: { type: string }
        os_version: { type: string }
        locale: { type: string }
        timezone: { type: string }
    InstallationRequest:
      type: object
      required: [installation_id, platform]
      additionalProperties: false
      properties:
        installation_id: { type: string, pattern: "^[A-Za-z0-9-]{8,64}$", description: "UUID, создаётся приложением один раз" }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string, example: "1.0" }
        app_build: { type: string, example: "4" }
        os_name: { type: string, example: "iOS" }
        os_version: { type: string, example: "26.5" }
        device_model: { type: string, example: "iPhone17,1" }
        manufacturer: { type: string, example: "Apple" }
        locale: { type: string, enum: [kk, ru, en, uz] }
        timezone: { type: string, example: "Asia/Almaty" }
        notification_permission:
          type: string
          enum: [authorized, denied, not_determined, provisional, ephemeral, unknown]
        notifications_enabled: { type: boolean, description: "переключатель в приложении" }
        push:
          type: object
          description: Нет токена — не присылать
          required: [token]
          additionalProperties: false
          properties:
            provider: { type: string, enum: [fcm], description: "на обеих платформах; можно не указывать" }
            token: { type: string, minLength: 20, maxLength: 1024, pattern: "^[A-Za-z0-9_:.-]+$", description: "FCM registration token" }
    Installation:
      type: object
      properties:
        installation_id: { type: string }
        attached: { type: boolean }
        push_status: { type: string, enum: [none, active, invalid, replaced], description: "invalid — FCM отклонил токен; тот же токен остаётся invalid, нужен новый (кроме SENDER_ID_MISMATCH)" }
        push_available: { type: boolean, description: "сервер сейчас может отправлять push" }
        notifications_enabled: { type: boolean }
        preferences:
          type: object
          description: Только с входом
          additionalProperties: { type: boolean }
    NotificationPreferences:
      type: object
      description: "marketing — только по явному согласию: без сохранённого выбора false; остальные категории без выбора включены"
      properties:
        preferences:
          type: object
          additionalProperties: { type: boolean }
          example: { account: true, subscription: true, security: true, system: true, marketing: false }
        optional:
          type: array
          items: { type: string }
          example: [account, subscription, system, marketing]
    AudienceFilter:
      type: object
      additionalProperties: false
      description: Все условия через И; только установки активных обычных аккаунтов.
      properties:
        segment: { type: string, enum: [all, free, paid, demo] }
        plan_ids: { type: array, items: { type: string } }
        subscription: { type: string, enum: [active, expired] }
        platforms: { type: array, items: { type: string, enum: [android, ios] } }
        languages: { type: array, items: { type: string, enum: [kk, ru, en, uz] }, description: язык уведомления }
        quota: { type: string, enum: [has_remaining, near_exhaustion, exhausted] }
        user_ids: { type: array, items: { type: string } }
        emails: { type: array, items: { type: string }, description: "вместе с user_ids — не больше 500" }
    CampaignRequest:
      type: object
      additionalProperties: false
      properties:
        name: { type: string }
        category: { type: string, enum: [subscription, system, marketing], default: marketing, description: "security и account — только события сервера (400, details.field = category)" }
        fallback_locale: { type: string, enum: [kk, ru, en, uz], default: ru }
        title: { type: object, additionalProperties: { type: string, maxLength: 80 }, example: { kk: "Жаңалық", ru: "Новость", en: "News", uz: "" } }
        body: { type: object, additionalProperties: { type: string, maxLength: 400 } }
        link: { type: string, example: "aireply://compose" }
        data: { type: object, maxProperties: 10, additionalProperties: { type: string }, description: "ключи ^[a-z][a-z0-9_]{0,31}$; служебные и начинающиеся с google или gcm — 400" }
        audience: { $ref: "#/components/schemas/AudienceFilter" }
        send: { type: boolean }
    Usage:
      type: object
      description: >-
        Порядок списания: дневной лимит тарифа → действующий пропуск → бесплатные ответы →
        начисления администратора → купленные пакеты (старые первыми). Месячный лимит тарифа
        закрывает только тариф; ответы из других источников не входят в used_today/used_month.
      properties:
        daily_limit: { type: integer }
        used_today: { type: integer, description: "только тариф" }
        remaining_today: { type: integer, description: "только тариф; не больше остатка месяца, если monthly_limit > 0" }
        monthly_limit: { type: integer, description: "0 — без месячного лимита" }
        used_month: { type: integer, description: "только тариф" }
        resets_at: { type: string, format: date-time }
        timezone: { type: string }
        welcome:
          type: object
          description: "бесплатные ответы; поля нет, если у аккаунта их не было"
          properties:
            total: { type: integer, example: 50 }
            remaining: { type: integer, example: 35 }
        credits: { type: integer, description: "остаток начислений администратора и купленных пакетов" }
        pass:
          type: object
          description: "действующий пропуск; поля нет, если его нет"
          properties:
            expires_at: { type: string, format: date-time, example: "2026-10-21T15:00:00+05:00" }
            remaining: { type: integer }
        remaining_total: { type: integer, description: "remaining_today + pass + welcome + credits" }
        bucket: { type: string, enum: [daily, pass, welcome, admin, pack], description: "только в ответах /ai/reply и /ai/compose: чем оплачен этот ответ" }
    Credits:
      type: object
      properties:
        balance:
          type: object
          properties:
            welcome: { type: object, properties: { total: { type: integer }, remaining: { type: integer } } }
            credits: { type: integer }
            pass: { type: object, properties: { expires_at: { type: string, format: date-time }, remaining: { type: integer } } }
        entries:
          type: array
          description: "последние 50, новые первыми"
          items:
            type: object
            properties:
              entry: { type: string, enum: [grant, consume, refund, revoke] }
              delta: { type: integer }
              kind: { type: string, enum: [welcome, admin, pack, pass] }
              created_at: { type: string, format: date-time }
    IAPProduct:
      type: object
      required: [code, kind, units, duration_hours, store_product_id, name]
      properties:
        code: { type: string, example: pack_50 }
        kind: { type: string, enum: [pack, pass], description: "pack не сгорает; pass — units ответов на duration_hours часов" }
        units: { type: integer, example: 50 }
        duration_hours: { type: integer, description: "0 у пакета", example: 0 }
        store_product_id: { type: string, description: "Product ID в App Store Connect / Play Console" }
        name: { type: string, description: "на языке аккаунта; цену и название показывает магазин" }
    IAPProductInput:
      type: object
      additionalProperties: false
      required: [code, kind, units]
      properties:
        code: { type: string, pattern: "^[a-z0-9][a-z0-9_]{1,39}$" }
        kind: { type: string, enum: [pack, pass] }
        units: { type: integer, minimum: 1, maximum: 100000 }
        duration_hours: { type: integer, minimum: 0, maximum: 720, description: "1…720 у пропуска, 0 у пакета" }
        apple_product_id: { type: string, pattern: "^[A-Za-z0-9._-]{1,100}$" }
        google_product_id: { type: string, pattern: "^[a-z0-9][a-z0-9._]{0,99}$" }
        name: { type: object, properties: { kk: { type: string }, ru: { type: string }, en: { type: string }, uz: { type: string } }, description: "до 60 символов" }
        is_active: { type: boolean, description: "нужен хотя бы один Product ID" }
        sort_order: { type: integer, minimum: 0, maximum: 10000 }
    PurchaseResult:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [granted, already_granted] }
        usage: { $ref: "#/components/schemas/Usage" }
    DeleteAccountRequest:
      type: object
      additionalProperties: false
      properties:
        apple_authorization_code: { type: string, description: "свежий authorization code Sign in with Apple (iOS)" }
    DeleteAccountResult:
      type: object
      properties:
        deleted: { type: boolean }
        apple_token_revoked: { type: boolean }
    AIReportRequest:
      type: object
      required: [mode, reason]
      additionalProperties: false
      properties:
        mode: { type: string, enum: [reply, compose] }
        reason: { type: string, enum: [offensive, harmful, false_info, wrong_language, other] }
        comment: { type: string, maxLength: 500 }
        text: { type: string, maxLength: 2000, description: "сгенерированный текст, только если пользователь решил его отправить" }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
    EmailChallenge:
      type: object
      required: [masked_email, expires_in, resend_after, code_length]
      properties:
        masked_email: { type: string, example: "a***m@mail.kz" }
        expires_in: { type: integer, example: 300 }
        resend_after: { type: integer, example: 32 }
        code_length: { type: integer, example: 4 }
    LegalConsentRequest:
      type: object
      required: [terms_version, privacy_version, locale, platform]
      properties:
        terms_version: { type: string }
        privacy_version: { type: string }
        locale: { type: string, enum: [kk, ru, en, uz] }
        platform: { type: string, enum: [ios, android] }
        app_version: { type: string }
    LegalConsent:
      allOf:
        - { $ref: "#/components/schemas/LegalConsentRequest" }
        - type: object
          required: [accepted_at]
          properties:
            accepted_at: { type: string, format: date-time }
