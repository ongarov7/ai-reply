# Docker deployment: configure .env and place the private Firebase JSON at the
# host path below before starting. The key is mounted, never copied into the image.
#
# Порттың жалғыз көзі — .env ішіндегі APP_PORT. Compose оны осы файлдағы
# ${APP_PORT} үшін де, контейнер ортасы үшін де сол .env-тен оқиды, сондықтан
# Go сервері, порт картасы мен healthcheck әрқашан бір портта болады.
services:
  backend:
    build: .
    env_file: .env
    environment:
      # Порт картасымен бірдей мән контейнерге де беріледі.
      APP_PORT: ${APP_PORT:?APP_PORT must be set in .env}
      # Контейнер ішінде барлық интерфейсті тыңдау керек, әйтпесе Docker трафикті
      # жеткізе алмайды. Сыртқа ашықтықты төмендегі 127.0.0.1 байланысы шектейді.
      APP_HOST: 0.0.0.0
      # Дерекқор әрқашан тұрақты томда жатады (контейнер қабатында емес).
      SQLITE_PATH: /app/data/aireply.db
    ports:
      # Тек localhost: сырттан кіру хосттағы Caddy арқылы ғана.
      - "127.0.0.1:${APP_PORT:?APP_PORT must be set in .env}:${APP_PORT:?APP_PORT must be set in .env}"
    volumes:
      - aireply-data:/app/data
      # Firebase Admin service account (push), read-only, kept outside the repo.
      # Place the file on the host before starting and set
      # FIREBASE_SERVICE_ACCOUNT_FILE=/run/secrets/firebase-service-account.json
      # in .env (docs/FIREBASE_SETUP.md). The runtime user is UID 10001;
      # give it read access to the host file. Refuse a missing source file.
      - type: bind
        source: /srv/ai-reply/secrets/ai-reply-4bf8f-31db4f3ee80d.json
        target: /run/secrets/firebase-service-account.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped

volumes:
  aireply-data:
