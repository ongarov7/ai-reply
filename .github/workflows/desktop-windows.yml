name: desktop-windows

on:
  push:
    branches: [windows-app, main, "codex/windows-**"]
    paths: ["AirReply-Windows/**", ".github/workflows/desktop-windows.yml"]
  pull_request:
    paths: ["AirReply-Windows/**", ".github/workflows/desktop-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
        working-directory: AirReply-Windows
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: AirReply-Windows/global.json

      - name: Restore
        run: dotnet restore AirReply.Windows.slnx

      - name: Build
        run: dotnet build AirReply.Windows.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --solution AirReply.Windows.slnx -c Release --no-build --report-xunit-trx --results-directory "${{ github.workspace }}/test-results" --results-directory-layout per-module

      # Failed tests become annotations, readable from the public checks API without a log download.
      - name: Annotate failed tests
        if: failure()
        run: |
          if (!(Test-Path "${{ github.workspace }}/test-results")) { exit 0 }
          Get-ChildItem "${{ github.workspace }}/test-results" -Filter *.trx -Recurse | ForEach-Object {
            [xml]$trx = Get-Content $_.FullName
            $trx.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -eq 'Failed' } | ForEach-Object {
              $message = ($_.Output.ErrorInfo.Message -replace "`r?`n", ' ')
              if ($message.Length -gt 900) { $message = $message.Substring(0, 900) }
              Write-Output "::error title=$($_.testName)::$message"
            }
          }

      - name: Publish
        run: ./scripts/Publish-Windows.ps1

      - name: Build standalone installer
        run: |
          $compiler = ./scripts/Get-InnoSetup.ps1 -DestinationRoot "${{ runner.temp }}/AIReply-InnoSetup"
          ./scripts/Build-Installer.ps1 -IsccPath $compiler

      - name: Test installer lifecycle
        run: ./scripts/Test-Installer.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: AIReply-windows
          path: |
            AirReply-Windows/out/AIReply-win-x64.zip
            AirReply-Windows/out/AIReply-win-arm64.zip
            AirReply-Windows/out/AIReply-Setup.exe
            AirReply-Windows/out/*.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: |
            ${{ github.workspace }}/test-results
            AirReply-Windows/tests/AirReply.App.Tests/bin/Release/net10.0/renders
            AirReply-Windows/out/installer-*.log
            AirReply-Windows/out/installer-test-results.json
          if-no-files-found: ignore
