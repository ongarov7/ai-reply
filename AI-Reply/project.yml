name: AIReply

# ---------------------------------------------------------------------------
# SIGNING NOTE - read before changing DEVELOPMENT_TEAM.
#
# The project and every target use the App Store Connect team (2PK6339Q47).
# Keep these values aligned so `xcodegen generate` cannot silently re-sign the
# app with another account.
# ---------------------------------------------------------------------------

options:
  bundleIdPrefix: kz.ai-reply
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 12.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: "NO"
    DEVELOPMENT_TEAM: 2PK6339Q47
    CODE_SIGN_STYLE: Automatic

targets:
  AIReply:
    type: application
    platform: iOS
    sources:
      - AIReply
      - Shared
    info:
      path: AIReply/Info.plist
      properties:
        CFBundleDisplayName: AI Reply
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        AIReplySignInWithApple: $(AIREPLY_SIGN_IN_WITH_APPLE)
        AIReplyPushNotifications: $(AIREPLY_PUSH_NOTIFICATIONS)
        # "<team id>.", for the installation id's app-only keychain group.
        AIReplyAppIdentifierPrefix: $(AppIdentifierPrefix)
        # Firebase Cloud Messaging: the options come from the build settings
        # below unless a GoogleService-Info.plist is added to the app.
        AIReplyFirebaseAppID: $(FIREBASE_GOOGLE_APP_ID)
        AIReplyFirebaseSenderID: $(FIREBASE_GCM_SENDER_ID)
        AIReplyFirebaseAPIKey: $(FIREBASE_API_KEY)
        AIReplyFirebaseProjectID: $(FIREBASE_PROJECT_ID)
        # The app forwards the APNs token and handles taps itself, and asks
        # for an FCM token only after the legal consent.
        FirebaseAppDelegateProxyEnabled: false
        FirebaseMessagingAutoInitEnabled: false
        # Google Sign-In: both values come from the build settings below.
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-sign-in
            CFBundleURLSchemes:
              - $(GOOGLE_IOS_REVERSED_CLIENT_ID)
        NSMicrophoneUsageDescription: AI Reply uses the microphone only while you are dictating a reply, and only after you tap the voice button.
        NSSpeechRecognitionUsageDescription: AI Reply uses Apple speech recognition to turn your dictated reply into text.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: Config/AIReply.entitlements
      properties:
        # Push notifications. "development" here; exporting for the App Store
        # (or TestFlight) re-signs it as "production".
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.kz.ai-reply.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)kz.ai-reply.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: kz.ai-reply.reply.keyboard.keyboard
        PRODUCT_NAME: AIReply
        DEVELOPMENT_TEAM: 2PK6339Q47
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "iPhone Developer"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        # Sign in with Apple: Debug builds hide the button (configs below) but
        # sign with the same entitlements as Release.
        AIREPLY_SIGN_IN_WITH_APPLE: "YES"
        # Push notifications (aps-environment is in the entitlements of both
        # configurations). The app asks for a token only when this is YES and
        # Firebase is configured.
        AIREPLY_PUSH_NOTIFICATIONS: "YES"
        # Firebase iOS app of this bundle id (not secrets; they ship in the
        # app). Empty keeps push off unless GoogleService-Info.plist is added.
        FIREBASE_GOOGLE_APP_ID: ""
        FIREBASE_GCM_SENDER_ID: ""
        FIREBASE_API_KEY: ""
        FIREBASE_PROJECT_ID: ""
        # iOS OAuth client from Google Cloud Console (not a secret; it ships in
        # the app). Empty keeps "Continue with Google" hidden in Release builds.
        GOOGLE_IOS_CLIENT_ID: ""
        # com.googleusercontent.apps.<id> - the client id reversed. Must match
        # GOOGLE_IOS_CLIENT_ID or the button stays hidden.
        GOOGLE_IOS_REVERSED_CLIENT_ID: $(PRODUCT_BUNDLE_IDENTIFIER).google-signin
      configs:
        Debug:
          AIREPLY_SIGN_IN_WITH_APPLE: "NO"
    dependencies:
      - target: ReplyKeyboard
        embed: true
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Firebase
        product: FirebaseCore
      - package: Firebase
        product: FirebaseMessaging

  AIReplyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AIReply
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kz.ai-reply.reply.keyboard.keyboard.tests
      DEVELOPMENT_TEAM: 2PK6339Q47
      GENERATE_INFOPLIST_FILE: true
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AIReply.app/AIReply"
      BUNDLE_LOADER: "$(TEST_HOST)"

  ReplyKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - ReplyKeyboard
      - Shared
    info:
      path: ReplyKeyboard/Info.plist
      properties:
        CFBundleDisplayName: AI Reply
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "4"
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Config/ReplyKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.kz.ai-reply.shared
        keychain-access-groups:
          - $(AppIdentifierPrefix)kz.ai-reply.shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: kz.ai-reply.reply.keyboard.keyboard.extension
      PRODUCT_NAME: ReplyKeyboardExtension
      DEVELOPMENT_TEAM: 2PK6339Q47
      CODE_SIGN_STYLE: Automatic
      TARGETED_DEVICE_FAMILY: "1"
      APPLICATION_EXTENSION_API_ONLY: true
      SKIP_INSTALL: true

schemes:
  AIReply:
    build:
      targets:
        AIReply: all
        ReplyKeyboard: all
        AIReplyTests: [test]
    test:
      targets:
        - AIReplyTests
    run:
      config: Debug
